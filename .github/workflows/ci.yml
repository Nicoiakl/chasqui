name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20: el runtime corre (FileStore/D1 real); las suites del emulador D1 saltan (node:sqlite es 22+).
        # 24: node:sqlite nativo, se ejercen TODAS las suites incluida la D1Store.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Cero dependencias: no hay `npm install`. La suite corre con node:test.
      - name: Pruebas
        run: npm test
      - name: Demos (humo)
        run: |
          node demo/e2e.js
          node demo/contratos.js
          node demo/piloto-d4.mjs
          node examples/hola-mundo.mjs
