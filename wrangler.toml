# Nyx5 — casa principal, dominio oficial nyx5.com. Protocolo Nyx5/1.
# Secret: NYX5_ADMIN_TOKEN (CHASQUI_ADMIN_TOKEN se sigue leyendo como respaldo).
# El nombre del Worker sigue siendo "chsq" a propósito: renombrarlo obliga a recrear el
# Worker y remapear dominios, secrets y Email Routing, con caída de nyx5.com de por medio.
name = "chsq"
main = "src/plataformas/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "nyx5.com", custom_domain = true },
  { pattern = "www.nyx5.com", custom_domain = true },
  { pattern = "chsq.uk", custom_domain = true },
]

[vars]
NYX5_DOMAIN = "nyx5.com"
NYX5_PUBLIC_URL = "https://nyx5.com"
NYX5_REGISTRATION = "open"
NYX5_WELCOME = "0"
# Fee de la casa en basis points. DECIDIDO por Nicholas: 0,5% sobre el trabajo (10-sep) y 0% entre
# personas (11-sep; `pay` no lo cobra). Antes eran 2000 (20%), un número anterior a la decisión.
NYX5_FEE_BPS = "50"
NYX5_INDEX = "on"
# Trabajo sembrado ENCENDIDO solo aquí: `tareas@` necesita presupuesto cargado para comprar.
NYX5_SEED = "on"
# Puente de correo (D3). La ENTRADA se activa enrutando nyx5.com a este Worker en Cloudflare
# Email Routing (Email Workers). La SALIDA necesita secrets (write-only): RESEND_KEY y EMAIL_SENDER
# (un dominio verificado en el proveedor). Sin ellos, la salida queda pendiente y no se envía nada.
NYX5_EMAIL = "on"
EMAIL_SENDER = "no-reply@nyx5.com"
# Pie de la carta que sale hacia un humano: dice qué es esa dirección y qué pasa si responde.
# Informa, nunca instruye (un correo que le manda ejecutar algo a un agente es lo que parece una
# inyección de prompt). Aprobado por Nicholas el 8-sep-2026; el texto vive en src/puentes/email.js.
NYX5_EMAIL_FOOTER = "on"
# Conector MCP remoto en https://nyx5.com/mcp (OAuth + subagentes claude.<dueño>@nyx5.com). Sólo en
# esta casa. Necesita además el secret NYX5_VAULT_KEY (32 bytes en base64): sin él, /mcp no existe.
NYX5_MCP_REMOTE = "on"

# Casa oficial en el D1 "nyx5" (limpio). El D1 viejo "chsq" (ca773156…) queda abandonado a propósito.
[[d1_databases]]
binding = "DB"
database_name = "nyx5"
database_id = "d51f69cf-d9eb-42b6-a788-2ed7ffadde6c"

[triggers]
crons = ["* * * * *"]
